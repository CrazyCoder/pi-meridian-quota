# Publishes this extension to npm as @jetserge/pi-meridian-quota.
#
# Auth is OIDC trusted publishing: no token is stored, and provenance is attached
# automatically. npm cannot publish a package's FIRST version over OIDC, because a
# trusted publisher is attached from the package settings page and that requires the
# package to exist (npm/cli#8544). So the first version is published by hand, the
# trusted publisher is attached, and every release after that runs here.
name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every gate but do not publish"
        type: boolean
        default: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # Anyone forking inherits this workflow along with the tags.
    if: github.repository == 'CrazyCoder/pi-meridian-quota'
    runs-on: ubuntu-latest
    permissions:
      contents: write # cutting the GitHub release
      id-token: write # OIDC auth for trusted publishing, and its provenance
    env:
      PKG: "@jetserge/pi-meridian-quota"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the release guard needs merge-base against the
          # default branch, which a shallow clone cannot answer.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Provenance needs npm >= 11.5.1 and Node 22 ships npm 10. Pinned to 11.x on
      # purpose: npm 12 fails provenance publishing with "Cannot find module
      # 'sigstore'". Revisit only once a 12.x release signs correctly.
      - run: npm install -g npm@11 && npm --version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Typecheck and tests
        run: bun run check

      - name: Verify tarball
        run: bun run verify:tarball

      # Publishing is irreversible: npm refuses to replace a version, so a manual run
      # from a branch would burn a version number on an untagged commit. Required on
      # EVERY publishing path, not just tag pushes. A dry run skips it so the pipeline
      # can be rehearsed from a branch.
      - name: Guard the release commit
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if [ "${{ github.event_name }}" = "push" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $VERSION"
            exit 1
          fi
          if ! git fetch --no-tags --depth=1 origin "+refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null; then
            echo "::error::no tag ${TAG} exists; create and push it before publishing ${VERSION}"
            exit 1
          fi
          if [ "$(git rev-list -n1 "$TAG")" != "$GITHUB_SHA" ]; then
            echo "::error::${TAG} does not point at the commit being built"
            exit 1
          fi

          # A tag can be created on any commit, including one never merged. Require the
          # release to come from the default branch. Checking that the tag points at
          # GITHUB_SHA is tautological on a tag push, since GITHUB_SHA IS the tagged
          # commit, so it proves nothing about which branch that commit is on.
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::commit $GITHUB_SHA is not on origin/main; refusing to publish"
            exit 1
          fi

      # The first version is published by hand and its tag pushed afterwards, which
      # re-runs this workflow against a version that already exists. Treat that as
      # success so the release step still fires; it also makes a re-run safe when
      # publishing succeeded but a later step failed.
      - name: Check whether this version is already published
        id: published
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PKG}@${VERSION}" version > /dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${PKG}@${VERSION} is already on the registry, skipping publish"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # No NODE_AUTH_TOKEN: the OIDC token authenticates this run and trusted
      # publishing attaches provenance itself. Fails cleanly, publishing nothing, if
      # the trusted publisher has not been attached yet.
      - name: Publish
        if: >-
          steps.published.outputs.already == 'false' &&
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
        run: npm publish --access public

      - name: Create GitHub release
        if: github.event_name == 'push'
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --notes "Published to npm: https://www.npmjs.com/package/${PKG}"
        env:
          GH_TOKEN: ${{ github.token }}
